<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkBuddy自动签到</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <img class="logo" src="icons/icon48.png" alt="" />
      <div class="title-block">
        <div class="title">WorkBuddy自动签到</div>
        <div class="subtitle" id="activeHint">加载中…</div>
      </div>
      <button class="icon-btn" id="refreshBtn" title="刷新全部账号">↻</button>
    </header>

    <div class="account-bar">
      <select id="accountSelect" aria-label="切换账号">
        <option value="">加载中…</option>
      </select>
      <button class="small-btn" id="renameBtn" title="重命名当前账号">改名</button>
    </div>

    <div class="summary" id="summary">
      <div class="summary-line">
        <span class="label">剩余</span>
        <span class="value" id="remain">—</span>
        <span class="sep">/</span>
        <span class="label">总量</span>
        <span class="value-dim" id="total">—</span>
        <span class="pct" id="pct"></span>
      </div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    </div>

    <div class="empty" id="empty" hidden>
      <p>还没有账号</p>
      <p class="muted">先在浏览器登录 codebuddy.cn 或 workbuddy.cn，再点「添加当前账号」</p>
    </div>

    <table class="packages" id="packages">
      <thead>
        <tr><th>套餐</th><th>剩余</th><th>总量</th><th>到期</th></tr>
      </thead>
      <tbody id="packageBody"></tbody>
    </table>

    <div class="status" id="status"></div>
    <div class="buddy-actions" id="buddyActions" hidden>
      <button class="small-btn" id="buddyClaimBtn">领积分</button>
      <button class="small-btn" id="buddyDepartBtn">去旅行</button>
    </div>
    <div class="updated" id="updated"></div>

    <div class="actions">
      <button class="small-btn primary" id="openSiteBtn">打开官网登录</button>
      <button class="small-btn primary" id="addBtn">添加当前账号</button>
    </div>
    <div class="actions">
      <button class="small-btn" id="usageBtn">官网用量页</button>
      <button class="small-btn danger" id="removeBtn">删除账号</button>
    </div>

    <details class="settings" id="settingsBox">
      <summary>设置</summary>
      <label>API 地址（一般无需修改，自动检测）<br /><input type="text" id="apiBase" /></label>
      <label>自动刷新间隔（分钟，0 关闭）<br /><input type="number" id="refreshInterval" min="0" /></label>
      <label class="check"><input type="checkbox" id="autoCheckin" /> 自动每日签到</label>
      <label class="check"><input type="checkbox" id="buddyTravel" /> 自动喵喵旅行</label>
      <button class="small-btn primary" id="saveSettings">保存设置</button>
      <p class="muted" style="margin-top:8px">多账号说明：切换账号会同步把浏览器的登录态切成该账号。</p>
    </details>

    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
