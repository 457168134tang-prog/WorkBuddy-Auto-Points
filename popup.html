<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkBuddy积分管家</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <img class="mark" src="icons/icon48.png" alt="" />
      <div class="names">
        <strong>WorkBuddy积分管家</strong>
        <span id="who">加载中…</span>
      </div>
      <button class="round" data-act="SYNC_ALL" title="立即同步所有账号" aria-label="立即同步所有账号">⟳</button>
    </header>

    <div class="picker">
      <div class="pickWrap">
        <button type="button" class="pickValue" id="whoPick" role="combobox" aria-label="切换账号" aria-haspopup="listbox" aria-controls="pickList" aria-expanded="false"><span id="pickLabel">加载中…</span></button>
        <div class="pickMenu" id="pickMenu" hidden>
          <div class="pickTools">
            <input id="pickSearch" type="text" placeholder="搜索账号" aria-label="搜索账号" autocomplete="off" />
            <button type="button" class="chip" id="sortBtn">积分↓</button>
          </div>
          <div class="pickList" id="pickList" role="listbox" aria-label="账号列表"></div>
        </div>
      </div>
      <button class="chip" id="renameBtn" data-act="RENAME">改名</button>
    </div>

    <div class="inline-edit" id="renameBox" hidden>
      <input id="renameInput" type="text" maxlength="24" aria-label="账号名称" />
      <button class="chip solid mini" data-act="RENAME_SAVE">保存</button>
      <button class="chip mini" data-act="RENAME_CANCEL">取消</button>
    </div>

    <section class="overview" id="overview">
      <div class="figures">
        <span class="caption">剩余</span>
        <b id="leftNum">—</b>
        <span class="slash">/</span>
        <span class="caption">总量</span>
        <span id="allNum">—</span>
        <em id="ratio"></em>
      </div>
      <div class="meter"><i id="meterFill"></i></div>
    </section>

    <div class="blank" id="blank" hidden>
      <p>还没有账号</p>
      <p class="dim">先登录 codebuddy.cn 或 workbuddy.cn，再点「保存当前账号」</p>
    </div>

    <table class="plans" id="planTable">
      <thead><tr><th>套餐</th><th>剩余</th><th>总量</th><th>到期</th></tr></thead>
      <tbody id="planBody"></tbody>
    </table>

    <div class="flags" id="flags"></div>
    <div class="trip">
      <button class="chip solid" id="claimBtn" data-act="COLLECT" hidden>领取奖励</button>
      <button class="chip" id="departBtn" data-act="DEPART" hidden>发起行程</button>
    </div>
    <p class="stamp" id="lastTime"></p>

    <div class="pair">
      <button class="chip solid" data-act="LOGIN">登录账号</button>
      <button class="chip solid" data-act="ADOPT">保存当前账号</button>
    </div>
    <div class="pair">
      <button class="chip" data-act="PLANS">用量页</button>
      <button class="chip danger" id="forgetBtn" data-act="FORGET">移除账号</button>
    </div>

    <div class="inline-edit danger-edit" id="forgetBox" hidden>
      <span id="forgetText">确定移除？</span>
      <button class="chip danger mini" data-act="FORGET_YES">确认移除</button>
      <button class="chip mini" data-act="FORGET_NO">取消</button>
    </div>

    <details class="config" id="configBox">
      <summary>选项</summary>
      <label>服务地址（通常自动识别）<input id="apiHost" type="text" /></label>
      <label>自动同步间隔（分钟，0 关闭）<input id="minutes" type="number" min="0" /></label>
      <label class="toggle"><input id="autoDaily" type="checkbox" /> 自动领取每日积分</label>
      <label class="toggle"><input id="autoTrip" type="checkbox" /> 自动处理积分行程</label>
      <button class="chip solid wide" data-act="WRITE_CONFIG">保存选项</button>
    </details>

    <div class="flash" id="flash" hidden></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
